<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Vive San Fermín</title>
    <link rel="icon" href="../img/logos/VIVESF_FAVICON.ico">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">
    <div class="login-box">
        <h1>Área de gestión</h1>
        <p>Acceso privado — Vive San Fermín</p>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Contraseña">
        <button id="btnLogin">Entrar</button>
        <p class="login-error" id="error">Email o contraseña incorrectos</p>
    </div>

    <script type="module">
        import { supabase } from './js/supabase.js'

        // Si ya hay sesión activa, redirige directamente
        const { data: { session } } = await supabase.auth.getSession()
        if (session) window.location.href = 'panel.html'

        document.getElementById('btnLogin').addEventListener('click', async () => {
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value

            const { error } = await supabase.auth.signInWithPassword({ email, password })

            if (error) {
                document.getElementById('error').style.display = 'block'
            } else {
                window.location.href = 'panel.html'
            }
        })
    </script>
</body>
</html>
