<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Proveedores — Vive San Fermín</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div class="topbar">
        <span class="topbar-title">Gestión de Proveedores</span>
        <button class="hamburger" id="hamburger">
            <span></span><span></span><span></span>
        </button>
    </div>

    <div class="overlay-menu" id="overlayMenu"></div>

    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="../index.html" style="text-decoration:none">
                    <h1>Vive San Fermín</h1>
                </a>
                <p>Gestión de reservas</p>
            </div>
            <nav>
                <a href="panel.html">📈 Panel de control</a>
                <a href="formulario.html">📝 Gestión de reservas</a>
                <a href="proveedores.html" class="active">🏠 Gestión de Proveedores</a>
                <a href="tablas.html">📊 Tablas</a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-logout" id="btnLogout">Cerrar sesión</button>
            </div>
        </aside>

        <main class="content">

            <!-- BLOQUE 1: PROVEEDOR -->
            <div class="bloque" id="bloque-proveedor">
                <h2>🏠 Proveedor</h2>
                <div class="form-grid">
                    <div class="form-field autocomplete-wrap">
                        <label>ID Proveedor</label>
                        <input type="text" id="inputProveedorId" placeholder="ID_PROVEEDOR" autocomplete="off">
                        <div class="autocomplete-list" id="autocompleteProveedorList" style="display:none"></div>
                    </div>
                    <div class="form-field">
                        <label>Nombre</label>
                        <input type="text" id="inputNombre" placeholder="Nombre del propietario">
                    </div>
                    <div class="form-field">
                        <label>Dirección</label>
                        <input type="text" id="inputDireccion" placeholder="Dirección">
                    </div>
                    <div class="form-field">
                        <label>Forma de pago</label>
                        <select id="selectFormaPago">
                            <option value="">— Sin especificar —</option>
                            <option value="efectivo">Efectivo</option>
                            <option value="transferencia">Transferencia</option>
                            <option value="bizum">Bizum</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>
                    <div class="form-field" style="display:flex; align-items:center; gap:8px; padding-top:20px">
                        <input type="checkbox" id="checkFactura" style="width:auto; margin:0">
                        <label for="checkFactura" style="text-transform:none; letter-spacing:0; font-size:13px; color:var(--text)">Con factura</label>
                    </div>
                    <div class="form-field">
                        <label>Comentarios</label>
                        <input type="text" id="inputProveedorComments" placeholder="Comentarios">
                    </div>
                </div>
                <div id="proveedor-status" style="margin-top:12px; font-size:12px; color:var(--subtle)"></div>
            </div>

            <!-- BLOQUE 2: AÑADIR/EDITAR SERVICIO -->
            <div class="bloque" id="bloque-servicio" style="display:none">
                <h2 id="titulo-bloque-servicio">➕ Añadir / Editar servicio</h2>
                <div class="form-grid">
                    <div class="form-field autocomplete-wrap">
                        <label>Servicio</label>
                        <input type="text" id="inputServicioId" placeholder="ID_SERVICIO" autocomplete="off">
                        <div class="autocomplete-list" id="autocompleteServicioList" style="display:none"></div>
                    </div>
                    <div class="form-field">
                        <label>Plazas</label>
                        <input type="number" id="inputPlazas" step="1" placeholder="Nº plazas">
                    </div>
                    <div class="form-field">
                        <label>Precio por plaza (€)</label>
                        <input type="number" id="inputPrecio" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-field">
                        <label>Coste total servicio (€)</label>
                        <input type="number" id="inputCosteTotal" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-field">
                        <label>Modelo de pago</label>
                        <select id="selectModelo">
                            <option value="capacity">Capacidad (pago total)</option>
                            <option value="consumption">Consumo (pago por uso)</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label>Coste calculado</label>
                        <input type="text" id="inputCosteServicio" disabled placeholder="—">
                    </div>
                </div>
                <div id="servicio-status" style="margin-top:8px; font-size:12px;"></div>
                <div class="btn-row">
                    <button class="btn btn-primary" id="btnGuardarServicio" disabled>Añadir servicio</button>
                    <button class="btn btn-secondary" id="btnCancelarServicio" style="display:none">✕ Cancelar</button>
                </div>
            </div>

            <!-- BLOQUE 3: SERVICIOS DEL PROVEEDOR -->
            <div class="bloque" id="bloque-servicios-proveedor" style="display:none">
                <h2>📋 Servicios del proveedor</h2>
                <div class="table-wrapper">
                    <table>
                        <thead><tr></tr></thead>
                        <tbody id="tbody-servicios-proveedor"></tbody>
                    </table>
                </div>
                <div class="btn-row">
                    <button class="btn btn-secondary" id="btnEditarServicios">✏️ Editar seleccionados</button>
                    <button class="btn btn-danger" id="btnEliminarServicio">🗑 Eliminar seleccionados</button>
                </div>
            </div>

            <!-- BLOQUE 4: PAGOS AL PROVEEDOR -->
            <div class="bloque" id="bloque-pagos-proveedor" style="display:none">
                <h2>💸 Pagos al proveedor</h2>
                <div id="resumen-coste-proveedor" style="margin-bottom:16px; font-size:13px; color:var(--subtle)"></div>
                <div class="table-wrapper" style="margin-bottom:12px">
                    <table>
                        <thead><tr>
                            <th>Concepto</th><th>Importe</th>
                            <th>Fecha</th><th>Pagado</th><th></th>
                        </tr></thead>
                        <tbody id="tbody-pagos-proveedor"></tbody>
                    </table>
                </div>
                <div class="btn-row">
                    <button class="btn btn-secondary" id="btnNuevoPagoProveedor">+ Añadir hito de pago</button>
                    <button class="btn btn-primary" id="btnGuardarPagos">💾 Guardar pagos</button>
                </div>
                <div id="form-nuevo-pago-proveedor" style="display:none; margin-top:14px">
                    <div class="form-grid">
                        <div class="form-field">
                            <label>Concepto</label>
                            <input type="text" id="pagoProvConcepto" placeholder="Ej: Prepago 1">
                        </div>
                        <div class="form-field">
                            <label>Importe (€)</label>
                            <input type="number" id="pagoProvImporte" step="0.01" placeholder="0.00">
                        </div>
                        <div class="form-field">
                            <label>Fecha</label>
                            <input type="date" id="pagoProvFecha">
                        </div>
                        <div class="form-field">
                            <label>Pagado</label>
                            <select id="pagoProvPagado">
                                <option value="false">No</option>
                                <option value="true">Sí</option>
                            </select>
                        </div>
                    </div>
                    <div class="btn-row">
                        <button class="btn btn-primary" id="btnGuardarPagoProveedor">Guardar hito</button>
                        <button class="btn btn-secondary" id="btnCancelarPagoProveedor">Cancelar</button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script type="module" src="js/proveedores.js"></script>
</body>
</html>
